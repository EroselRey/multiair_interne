function arc(a0, a1, R, wmax, thickAt) {
  const pts = [], n = 60, rad = (a) => a * Math.PI / 180;
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([R * Math.cos(rad(a)), R * Math.sin(rad(a))]); }
  for (let i = n; i >= 0; i--) {
    const u = i / n, a = a0 + (a1 - a0) * u;
    const w = wmax * Math.pow(Math.sin(Math.PI * u), .7) * (thickAt === 'start' ? 1.25 - .6 * u : .65 + .6 * u);
    pts.push([(R - w) * Math.cos(rad(a)), (R - w) * Math.sin(rad(a))]);
  }
  return 'M' + pts.map((p) => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' L') + 'Z';
}
